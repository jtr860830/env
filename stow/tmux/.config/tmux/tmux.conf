
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi







set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     50000

set -as terminal-features "xterm*:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g renumber-windows on
set -g set-titles on
set -g set-clipboard on

bind-key a send-prefix
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

set -g status-position     bottom
set -g status-justify      absolute-centre
set -g status-left-length  40
set -g status-right-length 40
setw -g window-status-separator ""
setw -g window-status-current-style default

set-hook -g client-dark-theme  'set -g @theme dark ; refresh-client'
set-hook -g client-light-theme 'set -g @theme light ; refresh-client'

set -g @c_bg           "#{?#{==:#{@theme},light},#fafafa,#282c34}"
set -g @c_fg           "#{?#{==:#{@theme},light},#383a42,#abb2bf}"
set -g @c_yellow       "#{?#{==:#{@theme},light},#c18401,#e5c07b}"
set -g @c_selection    "#{?#{==:#{@theme},light},#e9e9e9,#414858}"
set -g @c_cursearch_bg "#{?#{==:#{@theme},light},#6b5300,#fce094}"
set -g @c_cursearch_fg "#{?#{==:#{@theme},light},#eef1f8,#07080d}"
set -g @c_float_bg     "#{?#{==:#{@theme},light},#efefef,#21252b}"
set -g @c_comment      "#{?#{==:#{@theme},light},#9b9fa6,#7f848e}"
set -g @c_fg_gutter    "#{?#{==:#{@theme},light},#e1e1e1,#3d4350}"
set -g @c_cyan         "#{?#{==:#{@theme},light},#0184bc,#56b6c2}"
set -g @c_purple       "#{?#{==:#{@theme},light},#a626a4,#c678dd}"
set -g @c_gray         "#{?#{==:#{@theme},light},#a0a1a7,#5c6370}"

set -g status-style          "bg=#{E:@c_bg}"
set -g message-style         "bg=#{E:@c_bg},fg=#{E:@c_fg},fill=#{E:@c_bg}"
set -g message-command-style "bg=#{E:@c_bg},fg=#{E:@c_yellow},fill=#{E:@c_bg}"
set -g mode-style            "bg=#{E:@c_selection},fg=#{E:@c_fg}"

set -g copy-mode-match-style         "bg=#{E:@c_selection},fg=#{E:@c_yellow}"
set -g copy-mode-current-match-style "bg=#{E:@c_cursearch_bg},fg=#{E:@c_cursearch_fg}"

set -g status-left  "#[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}]#[bg=#{E:@c_float_bg}]#[fg=#{E:@c_comment}] #{client_user}#[fg=#{E:@c_fg_gutter}]@#[fg=#{E:@c_fg}]#h #[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}]"
set -g status-right "#{?client_prefix,#[fg=#{E:@c_yellow}],#{?pane_in_mode,#[fg=#{E:@c_cyan}],#[fg=#{E:@c_purple}]}}#{?client_prefix,#[bg=#{E:@c_yellow}],#{?pane_in_mode,#[bg=#{E:@c_cyan}],#[bg=#{E:@c_purple}]}}#[fg=#{E:@c_bg}]#[bold]#{?window_zoomed_flag, ■,} #S #[nobold]#{?client_prefix,#[fg=#{E:@c_yellow}],#{?pane_in_mode,#[fg=#{E:@c_cyan}],#[fg=#{E:@c_purple}]}}#[bg=#{E:@c_bg}]"

set -g pane-border-style        "fg=#{E:@c_gray}"
set -g pane-active-border-style "fg=#{E:@c_gray}"

setw -g window-status-format         "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}]#[bg=#{E:@c_float_bg}],}#[fg=#{E:@c_comment}]#[bg=#{E:@c_float_bg}] ○ #{?#{==:#{window_index},#{session_windows}},#[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}],}}"
setw -g window-status-current-format "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}]#[bg=#{E:@c_float_bg}],}#[fg=#{E:@c_purple}]#[bg=#{E:@c_float_bg}] ● #{?#{==:#{window_index},#{session_windows}},#[fg=#{E:@c_float_bg}]#[bg=#{E:@c_bg}],}}"
