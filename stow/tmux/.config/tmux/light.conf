set -g status-style          "bg=#fafafa"
set -g message-style         "bg=#fafafa,fg=#383a42,fill=#fafafa"
set -g message-command-style "bg=#fafafa,fg=#c18401,fill=#fafafa"
set -g mode-style            "bg=#e9e9e9,fg=#383a42"

set -g copy-mode-match-style         "bg=#e9e9e9,fg=#c18401"
set -g copy-mode-current-match-style "bg=#6b5300,fg=#eef1f8"

set -g status-left  "#[fg=#efefef]#[bg=#fafafa]#[bg=#efefef]#[fg=#9b9fa6] #{client_user}#[fg=#e1e1e1]@#[fg=#383a42]#h #[fg=#efefef]#[bg=#fafafa]"
set -g status-right "#{?client_prefix,#[fg=#c18401],#{?pane_in_mode,#[fg=#0184bc],#[fg=#a626a4]}}#{?client_prefix,#[bg=#c18401],#{?pane_in_mode,#[bg=#0184bc],#[bg=#a626a4]}}#[fg=#fafafa]#[bold]#{?window_zoomed_flag, ■,} #S #[nobold]#{?client_prefix,#[fg=#c18401],#{?pane_in_mode,#[fg=#0184bc],#[fg=#a626a4]}}#[bg=#fafafa]"

set -g pane-border-style        "fg=#a0a1a7"
set -g pane-active-border-style "fg=#a0a1a7"

setw -g window-status-format         "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#efefef]#[bg=#fafafa]#[bg=#efefef],}#[fg=#9b9fa6]#[bg=#efefef] ○ #{?#{==:#{window_index},#{session_windows}},#[fg=#efefef]#[bg=#fafafa],}}"
setw -g window-status-current-format "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#efefef]#[bg=#fafafa]#[bg=#efefef],}#[fg=#a626a4]#[bg=#efefef] ● #{?#{==:#{window_index},#{session_windows}},#[fg=#efefef]#[bg=#fafafa],}}"
