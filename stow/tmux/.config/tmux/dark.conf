set -g status-style          "bg=#282c34"
set -g message-style         "bg=#282c34,fg=#abb2bf,fill=#282c34"
set -g message-command-style "bg=#282c34,fg=#e5c07b,fill=#282c34"
set -g mode-style            "bg=#414858,fg=#abb2bf"

set -g copy-mode-match-style         "bg=#414858,fg=#e5c07b"
set -g copy-mode-current-match-style "bg=#fce094,fg=#07080d"

set -g status-left  "#[fg=#21252b]#[bg=#282c34]#[bg=#21252b]#[fg=#7f848e] #{client_user}#[fg=#3d4350]@#[fg=#abb2bf]#h #[fg=#21252b]#[bg=#282c34]"
set -g status-right "#{?client_prefix,#[fg=#e5c07b],#{?pane_in_mode,#[fg=#56b6c2],#[fg=#c678dd]}}#{?client_prefix,#[bg=#e5c07b],#{?pane_in_mode,#[bg=#56b6c2],#[bg=#c678dd]}}#[fg=#282c34]#[bold]#{?window_zoomed_flag, ■,} #S #[nobold]#{?client_prefix,#[fg=#e5c07b],#{?pane_in_mode,#[fg=#56b6c2],#[fg=#c678dd]}}#[bg=#282c34]"

set -g pane-border-style        "fg=#5c6370"
set -g pane-active-border-style "fg=#5c6370"

setw -g window-status-format         "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#21252b]#[bg=#282c34]#[bg=#21252b],}#[fg=#7f848e]#[bg=#21252b] ○ #{?#{==:#{window_index},#{session_windows}},#[fg=#21252b]#[bg=#282c34],}}"
setw -g window-status-current-format "#{?#{==:#{session_windows},1},,#{?#{==:#{window_index},1},#[fg=#21252b]#[bg=#282c34]#[bg=#21252b],}#[fg=#c678dd]#[bg=#21252b] ● #{?#{==:#{window_index},#{session_windows}},#[fg=#21252b]#[bg=#282c34],}}"
